apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - statefulset.yaml
  - service.yaml

configMapGenerator:
  - name: clickhouse-initdb
    files:
      - initdb/schema.sql
  - name: clickhouse-config
    files:
      - config.d/kafka.xml
      - config.d/memory.xml
  - name: clickhouse-users
    files:
      - users.d/api.xml

generatorOptions:
  disableNameSuffixHash: true
