# Routes the node's port 80 to the api through Traefik (bundled with k3s).
# On Docker Desktop there is no Traefik, so this is inert there; use `make pf-api` locally.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
