# Let's Encrypt via cert-manager (installed by deploy/vm/bootstrap.sh).
# __ACME_EMAIL__ is substituted by deploy/vm/deploy.sh from ACME_EMAIL.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: __ACME_EMAIL__
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
