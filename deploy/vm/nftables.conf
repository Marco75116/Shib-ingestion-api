#!/usr/sbin/nft -f
# Host firewall for the k3s VM. Installed by deploy/vm/bootstrap.sh to /etc/nftables.conf.
# Only this table is managed; k3s keeps its own tables (nat/mangle for services and pods).
# __PUBLIC_PORTS__ is substituted by bootstrap: "22" when Pangolin/Newt publishes the API,
# "22, 80, 443" when the API is served directly from the VM's IP.

table inet firewall
delete table inet firewall
table inet firewall {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # inbound from the internet: only these
        tcp dport { __PUBLIC_PORTS__ } accept

        # cluster-internal: pods -> node (kubelet, API server, DNS, metrics)
        iifname { "cni0", "flannel.1" } accept
        ip saddr { 10.42.0.0/16, 10.43.0.0/16 } accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        ct state established,related accept
        ct state invalid drop

        # pods may go anywhere (outbound to Kafka, Pangolin, image pulls) and talk to each other
        iifname { "cni0", "flannel.1" } accept

        # internet -> pods only on the public ports (this is how Traefik's 80/443 arrive: DNAT then forward)
        tcp dport { __PUBLIC_PORTS__ } accept
    }
}
